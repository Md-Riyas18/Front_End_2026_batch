    <h2>student</h2>
    <table>
        <thead>
            <th>no</th>
            <th>name</th>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>

    <script>
        let name = [10 , 20 ,30 ]

        const body=document.getElementById("tbody")
        let datas = "";
        for (let b = 0; b < name.length ; b ++ ){
            datas += `<tr>
                <td>${b+1}</td>
                <td>${name[b]}</td>

                </tr>`

            
        }
        body.innerHTML=datas;

    </script>
