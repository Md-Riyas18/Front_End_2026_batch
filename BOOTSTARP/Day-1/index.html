<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
    <div class="bg-light d-flex justify-content-between flex-row ps-4  shadow " > 
        <div class="d-flex flex-row justify-content-start  align-self-center  gap-5 ps-4">
            <img src="https://www.ilovepdf.com/img/ilovepdf.svg" alt="logo"  style="width: 130px; height: 50px;">
        <div class="bg-ligth h-25 w-25 align-self-center d-flex align-self-center  gap-4">
            <a href="" class="text-decoration-none  text-dark  fw-bold  text-nowrap">MERGE PDF</a>
            <a href="" class="text-decoration-none  text-dark  fw-bold  text-nowrap">SPLIT</a>
            <a href="" class="text-decoration-none  text-dark  fw-bold  text-nowrap">COMPRESS PDF</a>
            <a href="" class="text-decoration-none  text-dark  fw-bold  text-nowrap">CONVERT PDF</a>
        </div>
        </div>

    <div class="bg-light d-flex justify-content-end gap-3 me-4 align-self-center ">
            <h4 class="fs-5">Login</h4>
            <butto class="bg-danger text-light p-1 rounded-start fw-bold">Sign up</button>
    </div>
    </header>

    
    <section>
<body>

<div id="carouselExample" class="carousel slide my-carousel" data-bs-ride="carousel" data-bs-interval="3000">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://contents.mediadecathlon.com/s1468342/k$494413c175a8803797675b38bc075de8/defaut.jpg?format=auto&quality=70&f=1536x0"
                 class="d-block w-100"
                 alt="Banner 1">
        </div>

        <div class="carousel-item">
            <img src="https://contents.mediadecathlon.com/s1468341/k$d3260f94a2c6b129caef4246608c1133/defaut.jpg?format=auto&quality=70&f=1536x0"
                 class="d-block w-100"
                 alt="Banner 2">
        </div>

        <div class="carousel-item">
            <img src="https://contents.mediadecathlon.com/s1468348/k$ebe861d1b02a7486d93b0d5f11b6439f/defaut.jpg?format=auto&quality=70&f=1536x0"
                 class="d-block w-100"
                 alt="Banner 3">
        </div>

    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Previous</span>

    </button>


    <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Next</span>

    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </section>
</body>
</html>
