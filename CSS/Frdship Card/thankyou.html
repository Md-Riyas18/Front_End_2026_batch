
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You, Gayu Maa </title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
        // If this page is refreshed, return to index.html.
        // LocalStorage data remains saved.
        const navigationEntry = performance.getEntriesByType("navigation")[0];

        if (navigationEntry && navigationEntry.type === "reload") {
            window.location.replace("index.html");
        }
    </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-100 via-white to-pink-100 flex items-center justify-center p-5">

    <main class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-8 sm:p-10 text-center">

        <div class="text-6xl mb-6">🥹</div>

        <h1 class="text-3xl sm:text-4xl font-bold text-purple-700 mb-5">
            Thank You, Gayu Maa!
        </h1>

        <p class="text-lg text-pink-600 font-semibold mb-4">
            I Appreciate Your Honesty! 
        </p>

        <p class="text-gray-600 leading-7 mb-6">
            It's completely okay, Gayu Maa. 😊
            Thank you for being honest with me.
            Our memories are still special to me,
            and I respect your feelings. 🌷
        </p>

        <div class="text-4xl mb-6">🫶🏻✨</div>

        <p class="text-purple-500 font-medium">
            With Friendship, Always! 💌
        </p>

        <button
            id="homeBtn"
            type="button"
            class="mt-8 w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold py-4 rounded-full shadow-md transition hover:scale-105">

            Back To Home 🏡

        </button>

    </main>

    <script>
        // Count visits to the thank-you page.
        // This is separate from completed questionnaire submissions.
        const visitKey = "thankyou_page_visits";

        let visits = Number(localStorage.getItem(visitKey)) || 0;
        visits++;

        localStorage.setItem(visitKey, String(visits));

        // Save the thank-you message for the latest Not Interested response.
        // Do not add a second submission to friendship_history here,
        // because percentage.html already records that response.
        const thankYouMessage =
            "I Appreciate Your Honesty, Gayu Maa! 💗";

        localStorage.setItem(
            "friendship_thankyou_message",
            thankYouMessage
        );

        // Return to the home page.
        document.getElementById("homeBtn").addEventListener("click", () => {
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
