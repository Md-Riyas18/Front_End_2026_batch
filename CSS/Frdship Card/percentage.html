
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Percentage 💗</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #fff1f7, #f5edff);
            min-height: 100vh;
        }

        .card {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .gradient-button {
            background: linear-gradient(90deg, #f42ca0, #ae35ff);
            transition: transform 0.2s, opacity 0.2s;
        }

        .gradient-button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .gradient-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="flex items-center justify-center p-5">

    <main class="card w-full max-w-xl rounded-3xl bg-white p-8 sm:p-10 text-center">

        <div class="mb-4 text-5xl">💗</div>

        <h1 class="mb-3 text-3xl font-bold text-purple-700">
            How Much Do You Like Me?
        </h1>

        <p class="mb-8 text-gray-600">
            Be honest with me, Gayu Maa! 🥹
        </p>

        <form id="percentageForm" class="text-left">

            <label for="percentage" class="mb-3 block font-semibold text-gray-700">
                Choose your friendship percentage
            </label>

            <select
                id="percentage"
                required
                class="w-full rounded-xl border-2 border-pink-200 bg-pink-50 p-4 outline-none focus:border-purple-400"
            >
                <option value="">Select your answer 💕</option>
                <option value="10">10% 💗</option>
                <option value="20">20% 💕</option>
                <option value="30">30% 😊</option>
                <option value="40">40% 🥰</option>
                <option value="50">50% 💖</option>
                <option value="60">60% 💞</option>
                <option value="70">70% 💓</option>
                <option value="80">80% 💝</option>
                <option value="90">90% 💘</option>
                <option value="100">100% — Best Friends Forever! 💗</option>
                <option value="not_interested">I'm not interested 😅</option>
            </select>

            <div class="py-7 text-center">
                <div id="selectedValue" class="text-4xl font-bold text-pink-500"></div>

                <p id="percentageMessage" class="mt-3 text-purple-700">
                    Choose one option above!
                </p>
            </div>

            <p
                id="statusMessage"
                role="status"
                aria-live="polite"
                class="mb-4 text-center text-sm text-red-600"
            ></p>

            <button
                id="nextBtn"
                type="submit"
                disabled
                class="gradient-button w-full rounded-full px-6 py-4 font-bold text-white shadow-md"
            >
                Next 💕
            </button>

        </form>
    </main>

    <script type="module">
        import {
            db,
            collection,
            addDoc,
            serverTimestamp
        } from "./firebase.js";

        const percentage = document.getElementById("percentage");
        const selectedValue = document.getElementById("selectedValue");
        const percentageMessage = document.getElementById("percentageMessage");
        const nextBtn = document.getElementById("nextBtn");
        const percentageForm = document.getElementById("percentageForm");
        const statusMessage = document.getElementById("statusMessage");

        function updateSelection() {
            const value = percentage.value;

            statusMessage.textContent = "";

            if (value === "not_interested") {
                selectedValue.textContent = "😅";
                percentageMessage.textContent =
                    "I Appreciate Your Honesty, Gayu Maa!";
                nextBtn.textContent = "Thank You 💗";
                nextBtn.disabled = false;

            } else if (value !== "") {
                selectedValue.textContent = value + "%";
                percentageMessage.textContent =
                    "Thank You For Being Honest, Gayu Maa!";
                nextBtn.textContent = "Next 💕";
                nextBtn.disabled = false;

            } else {
                selectedValue.textContent = "";
                percentageMessage.textContent = "Choose one option above!";
                nextBtn.textContent = "Next 💕";
                nextBtn.disabled = true;
            }
        }

        percentage.addEventListener("change", updateSelection);

        percentageForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const value = percentage.value;

            if (!value) return;

            nextBtn.disabled = true;
            statusMessage.className = "mb-4 text-center text-sm text-gray-600";
            statusMessage.textContent = "Please wait...";

            try {
                if (value === "not_interested") {
                    await addDoc(collection(db, "submissions"), {
                        type: "not_interested",
                        percentage: "not_interested",
                        reason: "",
                        answer: "",
                        createdAt: serverTimestamp()
                    });

                    localStorage.setItem(
                        "friendship_percentage",
                        JSON.stringify("not_interested")
                    );

                    window.location.href = "thankyou.html";
                    return;
                }

                const number = Number(value);

                if (
                    !Number.isInteger(number) ||
                    number < 10 ||
                    number > 100 ||
                    number % 10 !== 0
                ) {
                    throw new Error("Please select a valid percentage.");
                }

                sessionStorage.setItem(
                    "friendship_percentage",
                    String(number)
                );

                localStorage.setItem(
                    "friendship_percentage",
                    JSON.stringify(number)
                );

                window.location.href = "reason.html";

            } catch (error) {
                console.error("Firebase submission error:", error);

                statusMessage.className =
                    "mb-4 text-center text-sm text-red-600";

                if (error.code === "permission-denied" ||
                    error.code === "firestore/permission-denied") {
                    statusMessage.textContent =
                        "Firebase blocked this save because of its security rules.";
                } else {
                    statusMessage.textContent =
                        "Could not save your answer. Please check your connection and try again.";
                }

                nextBtn.disabled = false;
            }
        });

        updateSelection();
    </script>

</body>
</html>
