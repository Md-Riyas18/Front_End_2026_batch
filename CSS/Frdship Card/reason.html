
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Why Do You Like Me As A Friend?</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
        // If this page is refreshed, return to index.html.
        // LocalStorage data will remain saved.
        const navigationEntry = performance.getEntriesByType("navigation")[0];

        if (navigationEntry && navigationEntry.type === "reload") {
            window.location.replace("index.html");
        }
    </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-100 via-white to-purple-100 flex items-center justify-center p-5">

    <main class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-7 sm:p-10 text-center">

        <div class="text-5xl mb-5">🥺</div>

        <h1 class="text-3xl font-bold text-purple-700 mb-4">
            Why Should You Like Me?
        </h1>

        <p class="text-gray-600 mb-8">
            Tell me what you think, Gayu Maa!
        </p>

        <!-- Reason selection section -->
        <section id="reasonSection" class="text-left">

            <label for="reason"
                class="block font-semibold text-gray-700 mb-3">
                Choose one reason
            </label>

            <select id="reason"
                class="w-full border-2 border-pink-200 rounded-xl p-4 bg-pink-50 focus:outline-none focus:border-purple-400">

                <option value="">Select your reason 💌</option>

                <option value="Because you are a good friend 💗">
                    Because you are a good friend 💗
                </option>

                <option value="Because you make me smile 😊">
                    Because you make me smile 😊
                </option>

                <option value="Because you care about me 🫶">
                    Because you care about me 🫶
                </option>

                <option value="Because you are funny 😂">
                    Because you are funny 😂
                </option>

                <option value="Because I don't like you as a friend 😅">
                    Because I don't like you as a friend 😅
                </option>

            </select>

            <button id="reasonNextBtn" type="button" disabled
                class="w-full mt-6 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold py-4 rounded-full shadow-md transition hover:scale-105 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100">

                Next 💕

            </button>

        </section>

        <!-- Written answer section -->
        <form id="answerSection" class="hidden text-left">

            <label for="answer"
                class="block font-semibold text-gray-700 mb-3">
                Enna pidikum? Sollu Gayu Maa 
            </label>

            <textarea id="answer"
                rows="4"
                maxlength="1000"
                required
                placeholder="Write your answer here..."
                class="w-full border-2 border-pink-200 rounded-xl p-4 bg-pink-50 focus:outline-none focus:border-purple-400 resize-y"></textarea>

            <p class="text-sm text-gray-400 mt-2">
                Tell me in your own words. 💌
            </p>

            <button type="submit"
                class="w-full mt-5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold py-4 rounded-full shadow-md transition hover:scale-105">

                Submit 

            </button>

        </form>

        <!-- Thank-you message -->
        <section id="thankYouSection"
            class="hidden bg-pink-50 rounded-2xl p-6 mt-5">

            <div class="text-5xl mb-4">🥰</div>

            <h2 class="text-2xl font-bold text-purple-700 mb-4">
                Thanks for your time, Gayu Maa! 🥰
            </h2>

            <p class="text-gray-600">
                Your friendship answers have been saved successfully! 💌
            </p>

            <p class="text-pink-500 font-semibold mt-4">
                Thank you for sharing your thoughts! 
            </p>

        </section>

    </main>

    <script>
        const reason = document.getElementById("reason");
        const reasonNextBtn = document.getElementById("reasonNextBtn");
        const reasonSection = document.getElementById("reasonSection");
        const answerSection = document.getElementById("answerSection");
        const answer = document.getElementById("answer");
        const thankYouSection = document.getElementById("thankYouSection");

        const validReasons = [
            "Because you are a good friend 💗",
            "Because you make me smile 😊",
            "Because you care about me 🫶",
            "Because you are funny 😂",
            "Because I don't like you as a friend 😅"
        ];

        // Read the saved submission status.
        let alreadySubmitted = false;

        try {
            alreadySubmitted = JSON.parse(
                localStorage.getItem("friendship_submitted") || "false"
            ) === true;
        } catch (error) {
            alreadySubmitted = false;
        }

        // Restore the saved reason.
        const savedReason = localStorage.getItem("friendship_reason");

        if (savedReason && validReasons.includes(savedReason)) {
            reason.value = savedReason;
            reasonNextBtn.disabled = false;
        }

        // Restore the saved written answer.
        const savedAnswer = localStorage.getItem("friendship_answer");

        if (savedAnswer !== null) {
            answer.value = savedAnswer;
        }

        // Display the thank-you message.
        function showThankYou() {
            reasonSection.classList.add("hidden");
            answerSection.classList.add("hidden");
            thankYouSection.classList.remove("hidden");
        }

        // Keep the thank-you message visible after submission.
        if (alreadySubmitted) {
            showThankYou();
        }

        // Enable Next only for a valid reason.
        reason.addEventListener("change", () => {
            reasonNextBtn.disabled = !validReasons.includes(reason.value);
        });

        // Move to the written answer.
        reasonNextBtn.addEventListener("click", () => {

            if (alreadySubmitted) {
                showThankYou();
                return;
            }

            if (!validReasons.includes(reason.value)) {
                return;
            }

            localStorage.setItem("friendship_reason", reason.value);

            reasonSection.classList.add("hidden");
            answerSection.classList.remove("hidden");

            answer.focus();
        });

        // Save the completed questionnaire.
        answerSection.addEventListener("submit", (event) => {
            event.preventDefault();

            if (alreadySubmitted) {
                showThankYou();
                return;
            }

            const writtenAnswer = answer.value.trim();

            if (writtenAnswer === "") {
                answer.setCustomValidity("Please write your answer first.");
                answer.reportValidity();
                answer.setCustomValidity("");
                return;
            }

            if (!validReasons.includes(reason.value)) {
                reasonSection.classList.remove("hidden");
                answerSection.classList.add("hidden");
                return;
            }

            // Read existing history without deleting older entries.
            let history = [];

            try {
                const savedHistory = JSON.parse(
                    localStorage.getItem("friendship_history")
                );

                if (Array.isArray(savedHistory)) {
                    history = savedHistory;
                }
            } catch (error) {
                history = [];
            }

            // Get the latest selected percentage.
            let savedPercentage = null;

            try {
                savedPercentage = JSON.parse(
                    localStorage.getItem("friendship_percentage")
                );
            } catch (error) {
                savedPercentage = null;
            }

            const submission = {
                page: "reason",
                percentage: savedPercentage,
                reason: reason.value,
                answer: writtenAnswer,
                message: "Thanks for your time, Gayu Maa! 🥰 Your answers have been saved! 💌",
                date: new Date().toLocaleString()
            };

            // Add this completed submission to the history.
            history.push(submission);

            localStorage.setItem(
                "friendship_history",
                JSON.stringify(history)
            );

            // Store the total number of completed submissions.
            localStorage.setItem(
                "friendship_submission_count",
                String(history.length)
            );

            // Save the latest answers separately for easy access.
            localStorage.setItem("friendship_reason", reason.value);
            localStorage.setItem("friendship_answer", writtenAnswer);
            localStorage.setItem("friendship_submitted", JSON.stringify(true));

            // Prevent duplicate submissions during this questionnaire.
            alreadySubmitted = true;

            // Show the thank-you message.
            showThankYou();
        });
    </script>

</body>
</html>
