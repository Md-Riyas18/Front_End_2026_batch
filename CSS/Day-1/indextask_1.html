<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Classroom Details</title>

    <style>
        .title {
            color: white;
            background-color: rgb(18, 18, 238);
        }

        .section {
            color: black;
            background-color: rgb(255, 255, 255);
        }

        .section-title {
            color: rgb(0, 0, 0);
            background-color: rgb(252, 211, 78);
        }

        .teacher {
            color: rgb(0, 0, 0);
            background-color: rgb(193, 239, 255);
        }

        .student {
            color: rgb(255, 255, 255);
            background-color: rgb(122, 6, 6);
        }

        .topic {
            color: rgb(255, 243, 243);
            background-color: rgb(50, 184, 189);
        }

        .status {
            color: white;
            background-color: orange;
        }
    </style>
</head>

<body>
<div>
    <h1 class="title">CSS Class</h1>

    <div class="section">
        <h2 class="section-title">Teacher Information</h2>
        <p class="teacher">Teacher Name</p>
        <p class="teacher">Subject</p>
    </div>

    <div class="section">
        <h2 class="section-title">Student Information</h2>
        <p class="student">Arun</p>
        <p class="student">Priya</p>
        <p class="student">Kumar</p>
        <p class="student">Divya</p>
    </div>

    <div class="section">
        <h2 class="section-title">Today's Topics</h2>
        <p class="topic">HTML</p>
        <p class="topic">CSS</p>
        <p class="topic">JavaScript</p>
    </div>

    <div class="section">
        <h2 class="section-title">Class Status</h2>
        <p class="status">Class Started</p>
        <p class="status">Class In Progress</p>
        <p class="status">Class Completed</p>
    </div>
</div>
</body>
</html>
