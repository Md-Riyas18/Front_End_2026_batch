<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <section>
        <div>
            <div>
                <h1>Student Registration</h1>
            </div>
            <form action="">
                    <label for="">Name :</label>
                    <input type="text" placeholder="Enter the Name" required />

                <br><br>


                    <label for="">Email :</label>
                    <input type="email" placeholder="Enter the email" required/>
                <br><br>


                    <label for="">Password :</label>
                    <input type="password" placeholder="Enter the password" required/>
                <br><br>


                    <label for="">Age :</label>
                    <input type="date" placeholder="Enter the age " required/>
                <br><br>


                    <label for="">Gender :</label>
                    <input type="radio" name="gender" required/>Male
                    <input type="radio" name="gender" required/>Female
                <br><br>


                    <label for="">Course :</label>  
                    <select name="" id="" required>
                        <option value="1">JAVA</option>
                        <option value="2">PYTHON</option>
                        <option value="3">AI Engineering</option>
                    </select>
                <br><br>


                    <label for="">Skill :</label>
                    <textarea required name="" id=""></textarea>
                <br><br>


                    <label for="">Address :</label>
                    <input type="address" placeholder="Enter the Address" required/>
                <br><br>



                    <input type="submit"  value="Submit">
                    <input type="Reset"  value="Reset">
                <br><br>
            </form>

        </div>
    </section>
    
</body>
</html>
