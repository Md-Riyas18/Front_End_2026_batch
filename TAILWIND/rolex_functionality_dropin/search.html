<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Search | Rolex</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="css/style.css"></head>
<body class="bg-white text-[#111] font-[Arial,Helvetica,sans-serif] rolex-page-in">
<header class="h-[72px] relative flex items-center justify-center">
  <a href="index.html" class="absolute left-5 md:left-12 top-6 text-[13px] text-[#111]">×&nbsp; Close</a>
  <a href="index.html" class="rolex-crown" aria-label="Rolex home">♛</a>
</header>
<main class="min-h-[calc(100vh-72px)] px-5">
  <section class="max-w-[820px] mx-auto pt-[45px] md:pt-[80px]">
    <div class="relative max-w-[520px] mx-auto">
      <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-4 h-4 text-[#777]" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2"/></svg>
      <input id="search-page-input" type="search" autocomplete="off" placeholder="Search" class="w-full h-[46px] pl-12 pr-5 rounded-full bg-[#f7f7f7] outline-none text-[14px] focus:ring-1 focus:ring-[#087f4c]">
    </div>
    <div class="max-w-[520px] mx-auto mt-9">
      <h2 class="text-[#087f4c] font-bold text-[13px] mb-4">Shortcuts</h2>
      <div class="flex flex-col gap-3 text-[14px] text-[#444]">
        <a href="index.html" class="hover:text-[#087f4c]">Find your Rolex</a>
        <a href="index.html" class="hover:text-[#087f4c]">Configure Rolex watches</a>
        <a href="search.html" class="hover:text-[#087f4c]">Frequently Asked Questions</a>
      </div>
    </div>
  </section>
  <section class="max-w-[1100px] mx-auto pt-12 pb-16">
    <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    <p id="search-no-results" class="hidden text-center text-[#555] py-12">No results found</p>
  </section>
</main>
<div id="rolex-toast"></div>
<script src="js/products.js"></script><script src="js/favourites.js"></script><script src="js/search.js"></script>
</body></html>
