<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Store Locator | Rolex</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="css/style.css"></head>
<body class="bg-white text-[#111] font-[Arial,Helvetica,sans-serif]">
<header class="h-[64px] flex items-center justify-between px-5 md:px-20 border-b border-[#eee]">
  <a href="index.html" class="text-[13px] hover:text-[#087f4c]">☰&nbsp; Menu</a>
  <a href="index.html" class="rolex-crown" aria-label="Rolex home">♛</a>
  <nav class="flex items-center gap-5 text-[12px] font-bold">
    <a href="search.html" class="hover:text-[#087f4c]">⌕&nbsp; Search</a>
    <a href="location.html" class="text-[#087f4c]">●&nbsp; Store locator</a>
    <a href="favourites.html" class="hover:text-[#087f4c]">♥&nbsp; Favourites <span data-favourite-count class="hidden"></span></a>
  </nav>
</header>
<main class="h-[calc(100vh-64px)] min-h-[650px] flex flex-col lg:flex-row">
  <aside class="w-full lg:w-[340px] xl:w-[370px] shrink-0 border-r border-[#ddd] overflow-y-auto">
    <div class="px-5 py-4 border-b border-[#eee]">
      <p class="text-[#087f4c] text-[11px] font-bold mb-3">Results in India</p>
      <div class="flex gap-2"><button class="px-4 py-2 rounded-full border border-[#222] text-[11px]">Rolex Retailer</button><button class="px-4 py-2 rounded-full border border-[#ddd] text-[11px]">Rolex Certified Pre-Owned</button><button class="px-4 py-2 rounded-full border border-[#ddd] text-[11px]">Service centre</button></div>
    </div>
    <div id="store-list"></div>
  </aside>
  <section id="map-area" class="relative flex-1 min-h-[500px] map-grid overflow-hidden">
    <div class="absolute z-20 top-5 left-1/2 -translate-x-1/2 w-[min(500px,calc(100%-40px))]">
      <div class="relative"><svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[#777]" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2"/></svg><input id="map-search" placeholder="Find a store" class="w-full h-[44px] rounded-full bg-white/95 shadow-sm pl-11 pr-4 text-[13px] outline-none focus:ring-1 focus:ring-[#087f4c]"></div>
    </div>
    <div class="absolute inset-0 opacity-70">
      <div class="absolute left-[10%] top-[28%] text-[12px] text-[#68736f]">Arabian Sea</div>
      <div class="absolute left-[48%] top-[42%] text-[15px] font-bold text-[#6b746f]">India</div>
      <div class="absolute left-[39%] top-[28%] text-[12px] text-[#68736f]">Pakistan</div>
      <div class="absolute left-[63%] top-[30%] text-[12px] text-[#68736f]">Bangladesh</div>
      <div class="absolute left-[74%] top-[39%] text-[12px] text-[#68736f]">Myanmar</div>
      <div class="absolute left-[52%] top-[66%] text-[12px] text-[#68736f]">Sri Lanka</div>
    </div>
  </section>
</main>
<div id="rolex-toast"></div>
<script src="js/products.js"></script><script src="js/favourites.js"></script><script src="js/location.js"></script>
</body></html>
